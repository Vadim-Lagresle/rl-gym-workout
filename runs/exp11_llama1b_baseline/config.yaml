name: llama1b_baseline
date: 2026-05-30
model: meta-llama/Llama-3.2-1B-Instruct
model_path: models/Llama-3.2-1B-Instruct
system_prompt: "You are a helpful assistant."
description: Baseline Pass@1 de Llama-3.2-1B-Instruct sur TextCraft (sans training).

download_command: >
  source ~/envs/agentgym-rl/bin/activate && python -c "
  from huggingface_hub import snapshot_download
  snapshot_download('meta-llama/Llama-3.2-1B-Instruct',
      local_dir='models/Llama-3.2-1B-Instruct', ignore_patterns=['*.pt','*.gguf'])
  "

baseline_eval_command: >
  source ~/envs/agentgym-rl/bin/activate && python src/eval/eval_fullft.py
    --checkpoint models/Llama-3.2-1B-Instruct
    --run-name exp11_llama1b_baseline
    --system-prompt "You are a helpful assistant."

results: ~
