name: exp19.2_scratch_5e-6
date: 2026-07-20
description: >
  Étage 1 de la lignée « RL + few-shot » rejouée proprement (décision Vadim après
  l'audit du 20/07) : GRPO LoRA depuis le Qwen2.5-3B NU, k=10 exemples dans chaque
  rollout, au LR d'APPRENTISSAGE de la lignée historique (5e-6 = régime exp10.3),
  beta 0.01. L'échelle complète prévue, comparable étage par étage à exp10 :
  5e-6 (cet étage) → merge du best → 3.33e-6 → merge → 2.2e-6 → … → 7.33e-7.
  Leçon d'exp19/19.1 : le LR doit suivre le niveau de l'ancre — 7.33e-7 depuis
  zéro produit un adaptateur de polissage (||delta||~0.12) et un gain de
  polissage (+4), là où 3.33e-6 avait produit ||delta||~0.72 et +16 (exp10.5).

algorithm: GRPO (TRL + vLLM in-process), LoRA r=16/α=32, few-shot k=10 dans le prompt
model: models/Qwen2.5-3B-Instruct   # depuis zéro — ancre = Qwen nu
script: src/train/train_grpo.py --fewshot 10
hardware: 1× B200 192 GB HBM3e (Criteo JupyterHub)
wandb: (rempli au lancement)

training:
  fine_tuning: LoRA
  num_generations: 8
  gradient_accumulation_steps: 64
  max_completion_length: 512
  max_steps: 1000                   # l'étage 5e-6 (les bests exp10.3/10.5 tombaient vers 370-420)
  learning_rate: 5e-6               # régime exp10.3 (l'étage d'apprentissage, pas de polissage)
  beta_kl: 0.01
  fewshot: 10                       # 4×d2, 4×d3, 2×d4 — mêmes exemples fixes qu'exp19
  vllm_max_len: 20480
  eval_every: 50
  eval_items: 100
  save_steps: 47
  save_total_limit: 20
  output_root: /tmp/trl_grpo_runs

command: >
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  nohup python src/train/train_grpo.py
    --num-generations 8 --gradient-accumulation-steps 64
    --max-completion-length 512 --max-items 0
    --max-steps 1000 --learning-rate 5e-6 --beta 0.01
    --fewshot 10 --vllm-max-len 20480
    --eval-every 50 --eval-items 100
    --save-steps 47 --save-total-limit 20
    --output-root /tmp/trl_grpo_runs
    --use-vllm-inprocess --run-name exp19.2_scratch_5e-6
    > logs/exp19.2_scratch_5e-6.log 2>&1 &

references_pour_lecture:
  base_fewshot_k10_sans_RL: 30/100   # le départ attendu
  exp10_3_meme_LR_sans_fewshot: "≈30 → 35"
  exp19_lr_polissage: "30 → ~35 réel (43 = pic bruité)"
  objectif_etage: "dépasser nettement 40 avant le prochain warm-start"

risques:
  collapse: >
    exp10 (LR 1.5e-5, beta 0.001) s'était effondré ; ici 5e-6 + beta 0.01 = le
    couple validé par exp10.3. Surveiller kl et completions/mean_length sur wandb ;
    le save-best protège le meilleur état quoi qu'il arrive.

results:
  status: ARRÊTÉ manuellement au step 557/1000 (2026-07-21, décision Vadim — suspicion
    de reward hacking, écartée par l'analyse : c'est un collapse par emballement KL)
  eval_curve: >
    step 50: 26 | 100: 39 | 150: 37 | 200: 43 | 250: 41 | 300: 45 | 350: 42 |
    400: 18 | 450: 2 | 500: 5 | 550: 3
  best_pass_at_1: 45/100 (step 300)   # MEILLEUR résultat honnête de la lignée exp19
  best_checkpoint: saves/trl_grpo/exp19.2_scratch_5e-6_best  # adapter, home persistant
  kl_curve: "~0.0007-0.0008 stable steps 1-350 -> 1.76 (step ~450) -> 2.76 (step 550), ×3500"
  completions_mean_length: "~590-741 tokens (phase saine) -> 1700-2037 tokens (phase collapse)"

verdict: >
  PAS un reward hacking (le reward sparse 0/1 n'a pas de shaping exploitable, et il s'est
  EFFONDRÉ, pas maintenu artificiellement haut). Diagnostic confirmé par les logs : run
  sain et en progression jusqu'au step 300 (26→45, meilleur point réel de toute la lignée
  exp19, dépassant le pic winner's-curse 43 d'exp19), puis divergence brutale entre les
  steps 350-450 — KL explose ×3500, grad_norm monte, completions doublent/triplent,
  pass@1 s'effondre à 2-5. Collapse classique de policy RL (beta=0.01 insuffisant à
  retenir la dérive une fois enclenchée), pas un artefact de la fonction reward.
  Le save-best a protégé le step 300 (45/100) avant la casse — c'est l'état à reprendre.
  Piste de suite (à valider avant relance) : warm-start depuis ce best 45%, LR intermédiaire
  entre le régime d'apprentissage (5e-6, celui-ci) et le régime de polissage (7.33e-7),
  ex. 2-3e-6, avec surveillance rapprochée de kl (arrêt anticipé si kl > ~0.05-0.1
  soutenu sur plusieurs évals, plutôt que d'attendre le prochain point d'éval à 50 steps).
