name: deepseekr1_distill_baseline
date: 2026-05-30
model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
model_path: models/DeepSeek-R1-Distill-Qwen-1.5B
system_prompt: "You are a helpful assistant."
description: >
  Baseline Pass@1 de DeepSeek-R1-Distill-Qwen-1.5B sur TextCraft (sans training).
  Modèle distillé depuis DeepSeek-R1 sur architecture Qwen — même tokenizer que
  Qwen2.5, potentiellement meilleur raisonnement multi-étapes pour les recettes depth-2+.
  Attention : génère des tokens <think>...</think> en mode reasoning — vérifier que
  l'action est bien parsée après le bloc think.

download_command: >
  source ~/envs/agentgym-rl/bin/activate && python -c "
  from huggingface_hub import snapshot_download
  snapshot_download('deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B',
      local_dir='models/DeepSeek-R1-Distill-Qwen-1.5B', ignore_patterns=['*.pt','*.gguf'])
  "

baseline_eval_command: >
  source ~/envs/agentgym-rl/bin/activate && python src/eval/eval_fullft.py
    --checkpoint models/DeepSeek-R1-Distill-Qwen-1.5B
    --run-name exp14_deepseekr1_baseline
    --system-prompt "You are a helpful assistant."

results: ~
