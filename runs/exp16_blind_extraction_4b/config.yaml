    --run-name exp16_blind_extraction_4b
    --plans-dir runs/exp16_qwen35_4b/plans
    --blind

result:
  pass_at_1_blind: 46/100
  by_depth: {d1: "25/31", d2: "15/41", d3: "6/25", d4: "0/3"}
  extraction_errors: 0/100
  reference_informed: 54/100  # exp16_qwen35_4b
  flips_informed_ok_to_blind_fail: 16
  flips_informed_fail_to_blind_ok: 8

verdict: >
  L'extracteur informé n'apporte que +8 points nets au 4B (54 vs 46, soit 15 %
