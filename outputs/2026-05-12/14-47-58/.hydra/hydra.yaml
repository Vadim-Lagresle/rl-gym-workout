hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - trainer.n_gpus_per_node=1
    - trainer.nnodes=1
    - data.path=/home/v.lagresle/rl-gym-workout/AgentEval/textcraft
    - data.max_prompt_length=750
    - data.max_response_length=14098
    - data.n_samples=1
    - data.batch_size=8
    - agentgym.task_name=textcraft
    - agentgym.env_addr=http://127.0.0.1:36005
    - agentgym.max_rounds=30
    - agentgym.timeout=500
    - model.path=/home/v.lagresle/rl-gym-workout/models/Qwen2.5-3B-Instruct
    - rollout.gpu_memory_utilization=0.85
    - rollout.temperature=1
    - rollout.max_model_len=16384
    - rollout.max_tokens=512
    - rollout.tensor_model_parallel_size=1
    - rollout.load_format=safetensors
    - rollout.rollout_log_dir=/home/v.lagresle/rl-gym-workout/executer_logs
  job:
    name: main_generation
    chdir: null
    override_dirname: agentgym.env_addr=http://127.0.0.1:36005,agentgym.max_rounds=30,agentgym.task_name=textcraft,agentgym.timeout=500,data.batch_size=8,data.max_prompt_length=750,data.max_response_length=14098,data.n_samples=1,data.path=/home/v.lagresle/rl-gym-workout/AgentEval/textcraft,model.path=/home/v.lagresle/rl-gym-workout/models/Qwen2.5-3B-Instruct,rollout.gpu_memory_utilization=0.85,rollout.load_format=safetensors,rollout.max_model_len=16384,rollout.max_tokens=512,rollout.rollout_log_dir=/home/v.lagresle/rl-gym-workout/executer_logs,rollout.temperature=1,rollout.tensor_model_parallel_size=1,trainer.n_gpus_per_node=1,trainer.nnodes=1
    id: ???
    num: ???
    config_name: generation
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/v.lagresle/rl-gym-workout
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/v.lagresle/rl-gym-workout/AgentGym-RL/verl/agent_trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/v.lagresle/rl-gym-workout/outputs/2026-05-12/14-47-58
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
